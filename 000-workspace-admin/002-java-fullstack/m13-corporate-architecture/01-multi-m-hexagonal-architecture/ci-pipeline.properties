# CI/CD pipeline selector.
#
# Both .github/workflows/ci-cd.yml (GitHub Actions) and azure-pipelines.yml
# (Azure DevOps) are present in this repository at all times. Each pipeline
# reads this file before doing any build/push/deploy work and only proceeds
# if its own platform name matches the value below - otherwise it exits as
# a no-op. This lets you switch which CI/CD system is "active" by editing a
# single line here instead of touching either pipeline definition.
#
# Allowed values: github-actions | azure-devops
ci.pipeline=github-actions
