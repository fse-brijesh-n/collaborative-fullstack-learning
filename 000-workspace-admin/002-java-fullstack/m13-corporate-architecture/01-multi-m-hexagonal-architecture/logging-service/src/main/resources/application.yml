server:
  port: 8084

spring:
  application:
    name: logging-service
  datasource:
    url: jdbc:h2:mem:loggingdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      # Flyway migrations (src/main/resources/db/migration) own the schema now;
      # Hibernate only validates entities match at startup - it never auto-generates DDL.
      # See docs/11-database-migrations.md.
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

security:
  jwt:
    secret: ${JWT_SECRET:learning-project-demo-secret-key-change-me}

management:
  endpoints:
    web:
      exposure:
        include: health,info
